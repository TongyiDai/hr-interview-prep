" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">3</text><text x="858" y="402" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">4</text><text x="830" y="447" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">评分锚定</text><rect x="970" y="305" width="76" height="94" fill="none" stroke="#222222" stroke-width="1.5" /><rect x="980" y="295" width="76" height="94" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1" /><line x1="992" y1="328" x2="1036" y2="328" stroke="#B8B8B8" stroke-width="1" /><line x1="992" y1="348" x2="1036" y2="348" stroke="#B8B8B8" stroke-width="1" /><line x1="992" y1="368" x2="1036" y2="368" stroke="#B8B8B8" stroke-width="1" /><text x="1012" y="447" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="600" letter-spacing="0px" fill="#111111">独立复盘</text><path d="M 1012 430 C 1012 538 192 538 192 430" fill="none" stroke="#B8B8B8" stroke-width="1.2" marker-end="url(#arrow)" /><text x="602" y="568" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" letter-spacing="0px" fill="#666666">复盘结果回到岗位标准</text>
